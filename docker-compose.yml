name: qubeerp

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    ports:
      - "127.0.0.1:14330:1433"
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "test -x /opt/mssql-tools18/bin/sqlcmd && SQLCMDPASSWORD=\"$$MSSQL_SA_PASSWORD\" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q 'SELECT 1' -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  database-setup:
    image: mcr.microsoft.com/mssql/server:2022-latest
    entrypoint: ["/bin/bash", "/setup/Initialize-Databases.sh"]
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Run scripts/Initialize-LocalEnvironment.ps1}
      PRODUCT_DB_PASSWORD: ${PRODUCT_DB_PASSWORD:?Run scripts/Initialize-LocalEnvironment.ps1}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD:?Run scripts/Initialize-LocalEnvironment.ps1}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD:?Run scripts/Initialize-LocalEnvironment.ps1}
    volumes:
      - ./scripts/Initialize-Databases.sh:/setup/Initialize-Databases.sh:ro
      - ./scripts/Initialize-Databases.sql:/setup/Initialize-Databases.sql:ro
    depends_on:
      sqlserver:
        condition: service_healthy

  product-service:
    build:
      context: .
      dockerfile: src/ProductService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: Server=sqlserver;Database=ProductDb;User Id=qube_product;Password=${PRODUCT_DB_PASSWORD:?Run scripts/Initialize-LocalEnvironment.ps1};TrustServerCertificate=True;Connect Timeout=5
    ports:
      - "127.0.0.1:5101:8080"
    depends_on:
      database-setup:
        condition: service_completed_successfully

  inventory-service:
    build:
      context: .
      dockerfile: src/InventoryService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: Server=sqlserver;Database=InventoryDb;User Id=qube_inventory;Password=${INVENTORY_DB_PASSWORD:?Run scripts/Initialize-LocalEnvironment.ps1};TrustServerCertificate=True;Connect Timeout=5
      Services__Product: http://product-service:8080
    ports:
      - "127.0.0.1:5102:8080"
    depends_on:
      database-setup:
        condition: service_completed_successfully

  order-service:
    build:
      context: .
      dockerfile: src/OrderService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: Server=sqlserver;Database=OrderDb;User Id=qube_order;Password=${ORDER_DB_PASSWORD:?Run scripts/Initialize-LocalEnvironment.ps1};TrustServerCertificate=True;Connect Timeout=5
      Services__Product: http://product-service:8080
      Services__Inventory: http://inventory-service:8080
      RabbitMQ__HostName: rabbitmq
      RabbitMQ__UserName: ${RABBITMQ_USERNAME:-qubeerp}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD:?Run scripts/Initialize-LocalEnvironment.ps1}
    ports:
      - "127.0.0.1:5103:8080"
    depends_on:
      database-setup:
        condition: service_completed_successfully

  rabbitmq:
    image: rabbitmq:4.2-management
    hostname: qubeerp-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-qubeerp}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Run scripts/Initialize-LocalEnvironment.ps1}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "gosu", "rabbitmq", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  order-event-worker:
    build:
      context: .
      dockerfile: src/OrderEventWorker/Dockerfile
    environment:
      RabbitMQ__HostName: rabbitmq
      RabbitMQ__UserName: ${RABBITMQ_USERNAME:-qubeerp}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD:?Run scripts/Initialize-LocalEnvironment.ps1}
    depends_on:
      rabbitmq:
        condition: service_started

volumes:
  sql-data:
  rabbitmq-data:
