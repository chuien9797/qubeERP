<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">QubeErp service architecture</title><desc id="desc">Clients call all three APIs. OrderService calls InventoryService for reservations and ProductService for product lookup. InventoryService checks ProductService when opening stock. Each API accesses only its own database in one local SQL Server instance.</desc><style>text{font-family:Arial,sans-serif;fill:#172554;font-size:15px}.title{font-size:18px;font-weight:700}.label{font-size:13px;fill:#334155}.box{fill:#eff6ff;stroke:#2563eb;stroke-width:1.5}.db{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.edge{fill:none;stroke:#475569;stroke-width:1.6;stroke-linejoin:miter}.event{stroke-dasharray:6 4}.group{fill:#f8fafc;stroke:#cbd5e1}.caption{font-size:13px;fill:#475569}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker></defs><rect width="1000" height="600" fill="white"/>
<rect x="345" y="20" width="310" height="56" fill="#172554"/><text x="500" y="54" text-anchor="middle" style="fill:white" class="">Angular · Swagger · HTTP clients</text>
<path d="M420 76V115H160V210" class="edge " marker-end="url(#arrow)"/><path d="M500 76V210" class="edge " marker-end="url(#arrow)"/><path d="M580 76V115H840V210" class="edge " marker-end="url(#arrow)"/>
<text x="175" y="161" text-anchor="start" class="label">HTTP</text><text x="515" y="161" text-anchor="start" class="label">HTTP</text><text x="855" y="161" text-anchor="start" class="label">HTTP</text>
<rect x="40" y="210" width="240" height="60" class="box"/><text x="160" y="245" text-anchor="middle" class="title">OrderService</text><rect x="380" y="210" width="240" height="60" class="box"/><text x="500" y="245" text-anchor="middle" class="title">InventoryService</text><rect x="720" y="210" width="240" height="60" class="box"/><text x="840" y="245" text-anchor="middle" class="title">ProductService</text>
<path d="M280 240H380" class="edge " marker-end="url(#arrow)"/><text x="330" y="190" text-anchor="middle" class="label">Reserve / query</text><text x="330" y="206" text-anchor="middle" class="label">/ release</text>
<path d="M620 240H720" class="edge " marker-end="url(#arrow)"/><text x="670" y="190" text-anchor="middle" class="label">Opening-count</text><text x="670" y="206" text-anchor="middle" class="label">product check</text>
<path d="M240 270V350H760V270" class="edge " marker-end="url(#arrow)"/><text x="600" y="338" text-anchor="middle" class="label">Product lookup</text>
<rect x="20" y="420" width="960" height="140" class="group"/><text x="330" y="447" text-anchor="middle" class="title">Local SQL Server</text>
<path d="M160 270V474" class="edge "/><path d="M500 270V343M500 357V474" class="edge "/><path d="M840 270V474" class="edge "/>
<path d="M60 486V538C60 554 260 554 260 538V486" class="db"/><ellipse cx="160" cy="486" rx="100" ry="12" class="db"/><text x="160" y="523" text-anchor="middle" class="title">OrderDb</text><path d="M400 486V538C400 554 600 554 600 538V486" class="db"/><ellipse cx="500" cy="486" rx="100" ry="12" class="db"/><text x="500" y="523" text-anchor="middle" class="title">InventoryDb</text><path d="M740 486V538C740 554 940 554 940 538V486" class="db"/><ellipse cx="840" cy="486" rx="100" ry="12" class="db"/><text x="840" y="523" text-anchor="middle" class="title">ProductDb</text>
<text x="500" y="586" text-anchor="middle" class="caption">Arrows: HTTP calls     |     Plain lines: owned database access</text>
