<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="290" viewBox="0 0 1000 290" role="img" aria-labelledby="title desc"><title id="title">QubeErp asynchronous order notifications</title><desc id="desc">Order transitions and outbox events commit together in OrderDb. A background publisher inside OrderService polls the outbox, publishes to RabbitMQ with confirms and records delivery or retry information. RabbitMQ delivers events to OrderEventWorker, which validates and logs them.</desc><style>text{font-family:Arial,sans-serif;fill:#172554;font-size:15px}.title{font-size:18px;font-weight:700}.label{font-size:13px;fill:#334155}.box{fill:#eff6ff;stroke:#2563eb;stroke-width:1.5}.db{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.edge{fill:none;stroke:#475569;stroke-width:1.6;stroke-linejoin:miter}.event{stroke-dasharray:6 4}.group{fill:#f8fafc;stroke:#cbd5e1}.caption{font-size:13px;fill:#475569}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker></defs><rect width="1000" height="290" fill="white"/>
<rect x="20" y="20" width="265" height="235" class="group"/><text x="152" y="47" text-anchor="middle" class="title">OrderService process</text>
<rect x="40" y="70" width="225" height="48" class="box"/><text x="152.5" y="99" text-anchor="middle" class="title">Order transition</text><rect x="40" y="185" width="225" height="48" class="box"/><text x="152.5" y="214" text-anchor="middle" class="title">Background publisher</text>
<path d="M420 62V114C420 130 620 130 620 114V62" class="db"/><ellipse cx="520" cy="62" rx="100" ry="12" class="db"/><text x="520" y="99" text-anchor="middle" class="title">OrderDb</text><text x="520" y="145" text-anchor="middle" class="label">Orders + outbox</text>
<path d="M265 94H420" class="edge " marker-end="url(#arrow)"/><text x="342" y="79" text-anchor="middle" class="label">Commit together</text>
<path d="M265 200H355V110H420" class="edge "/><text x="375" y="164" text-anchor="start" class="label">Poll / record delivery</text>
<rect x="485" y="185" width="180" height="48" class="box"/><text x="575" y="214" text-anchor="middle" class="title">RabbitMQ</text><rect x="770" y="185" width="210" height="48" class="box"/><text x="875" y="214" text-anchor="middle" class="title">OrderEventWorker</text>
<path d="M265 220H485" class="edge event" marker-end="url(#arrow)"/><text x="375" y="245" text-anchor="middle" class="label">Publish with confirms</text>
<path d="M665 209H770" class="edge event" marker-end="url(#arrow)"/><text x="718" y="174" text-anchor="middle" class="label">Deliver events</text>
<text x="875" y="259" text-anchor="middle" class="caption">Validate and log</text>
</svg>
